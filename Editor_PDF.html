<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor de PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Arimo:ital,wght@0,400;0,700;1,400;1,700&family=Tinos:ital,wght@0,400;0,700;1,400;1,700&family=Cousine:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
/* Layout: barra superior, trilho de ferramentas, mesa com páginas de papel, painel de propriedades. */
:root{
  --bg:#e8ecef; --surface:#ffffff; --surface2:#f3f5f7; --ink:#14202b; --muted:#566575;
  --line:#d2d9e0; --accent:#0b7f73; --accent-ink:#ffffff; --accent-soft:#d6efea;
  --desk:#d9dfe5; --danger:#b3261e; --focus:#0b7f73;
  --shadow:0 1px 2px rgba(15,25,35,.14),0 10px 28px rgba(15,25,35,.14);
  --f-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161c; --surface:#18212a; --surface2:#1f2a35; --ink:#e5ebf1; --muted:#93a2b3;
    --line:#2d3a47; --accent:#3cc3b2; --accent-ink:#06211d; --accent-soft:#17403b;
    --desk:#0c1116; --danger:#ff8a80; --focus:#3cc3b2;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10161c; --surface:#18212a; --surface2:#1f2a35; --ink:#e5ebf1; --muted:#93a2b3;
  --line:#2d3a47; --accent:#3cc3b2; --accent-ink:#06211d; --accent-soft:#17403b;
  --desk:#0c1116; --danger:#ff8a80; --focus:#3cc3b2;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.4;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;min-width:0}

/* barra superior */
.top{display:flex;align-items:center;gap:12px;padding:8px max(16px,env(safe-area-inset-left,0px)) 8px max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;margin-right:4px}
.docname{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:0;max-width:34ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:default}
.zoom{display:flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.zoom .btn{padding:3px 9px}

/* área de trabalho */
.work{flex:1;min-height:0;display:grid;grid-template-columns:56px minmax(0,1fr) 288px;padding-inline:max(0px,env(safe-area-inset-left,0px)) max(0px,env(safe-area-inset-right,0px))}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0}
.tool{width:42px;height:46px;border:1px solid transparent;background:transparent;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:10px;font-weight:500}
.tool svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{background:var(--surface2);color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.desk{position:relative;overflow:auto;background:var(--desk);padding:24px 24px 64px;min-width:0}
.pages{display:flex;flex-direction:column;align-items:flex-start;width:max-content;min-width:100%}
.pagewrap{position:relative;margin:0 auto 28px;background:#fff;box-shadow:var(--shadow);flex:none}
.pgno{position:absolute;left:0;top:100%;margin-top:5px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.sheet{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;overflow:hidden}
.sheet canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.layer{position:absolute;inset:0}
.desk.t-text .layer,.desk.t-rect .layer{cursor:crosshair}

/* texto original do PDF */
.tx{position:absolute;white-space:pre;color:transparent;outline:none;padding:0;margin:0;cursor:text;caret-color:#000;border-radius:1px}
.tx:hover{box-shadow:0 0 0 1px var(--accent)}
.tx.on{box-shadow:0 0 0 1px var(--accent)}
.tx.cov{color:inherit}
.tx.sel{box-shadow:0 0 0 2px var(--accent)}

/* elementos adicionados */
.el{position:absolute;touch-action:none}
.el.text{white-space:pre;cursor:move;outline:none;padding:0 1px;min-width:12px;line-height:1.2}
.el.text.editing{cursor:text}
.el.sel{outline:calc(2px*var(--inv,1)) solid var(--accent);outline-offset:calc(1px*var(--inv,1))}
.el.image img{width:100%;height:100%;display:block;object-fit:cover;pointer-events:none;user-select:none;-webkit-user-drag:none}
.pic{position:absolute;inset:0;overflow:hidden}
.el.image.ell .pic{border-radius:50%}
.pb{position:absolute;cursor:pointer;z-index:0}
.pa{position:absolute;pointer-events:none;z-index:1}
.pa canvas{position:static!important;width:100%;height:100%;display:block}
.pa.sel{outline:calc(2px*var(--inv,1)) dashed var(--accent)}
.tx,.pi{z-index:2}
.el{z-index:3}
.pb:hover{box-shadow:inset 0 0 0 calc(1.5px*var(--inv,1)) var(--accent)}
.pb.sel{box-shadow:inset 0 0 0 calc(2.5px*var(--inv,1)) var(--accent)}
.pi{position:absolute;cursor:pointer}
.pi:hover{box-shadow:inset 0 0 0 calc(2px*var(--inv,1)) var(--accent);background:rgba(11,127,115,.10)}
.pi.sel{box-shadow:inset 0 0 0 calc(2px*var(--inv,1)) var(--accent);background:rgba(11,127,115,.14)}
.el.rect,.el.image{cursor:move}
.hd{position:absolute;width:calc(11px*var(--inv,1));height:calc(11px*var(--inv,1));background:var(--surface);border:calc(2px*var(--inv,1)) solid var(--accent);border-radius:50%;display:none}
.el.sel .hd{display:block}
.hd.nw{left:calc(-6px*var(--inv,1));top:calc(-6px*var(--inv,1));cursor:nwse-resize}
.hd.ne{right:calc(-6px*var(--inv,1));top:calc(-6px*var(--inv,1));cursor:nesw-resize}
.hd.sw{left:calc(-6px*var(--inv,1));bottom:calc(-6px*var(--inv,1));cursor:nesw-resize}
.hd.se{right:calc(-6px*var(--inv,1));bottom:calc(-6px*var(--inv,1));cursor:nwse-resize}
.el.text .hd{display:none!important}
.draft{position:absolute;border:calc(1.5px*var(--inv,1)) dashed var(--accent);background:rgba(11,127,115,.12);pointer-events:none}

/* painel */
.side{background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0}
.side h2{font-family:var(--f-display);font-size:15px;margin:0;letter-spacing:-.005em}
.side p{margin:0;color:var(--muted);font-size:13px}
.field{display:flex;flex-direction:column;gap:4px}
.field label,.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.field input[type=number],.field select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);width:100%}
.field input[type=color]{width:44px;height:30px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--surface2)}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface2);padding:5px 12px;font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.hint{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.hint li{display:flex;gap:8px;font-size:13px;color:var(--muted)}
.hint b{color:var(--ink);font-weight:600}
.meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:grid;gap:2px}
.status{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);max-width:calc(100vw - 32px);z-index:30}
.empty{align-self:center;width:min(440px,88vw);margin:12vh 0 0;padding:36px 24px;border:2px dashed var(--accent);border-radius:12px;background:var(--surface);text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.empty h2{font-family:var(--f-display);color:var(--ink);margin:0;font-size:22px}
.drop{outline:3px dashed var(--accent);outline-offset:-10px}

@media (max-width:860px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .work{display:flex;flex-direction:column;height:calc(100vh - 56px);min-height:520px}
  .rail{flex-direction:row;justify-content:center;border-right:0;border-bottom:1px solid var(--line);padding:6px 0}
  .desk{flex:1;min-height:260px;padding:14px 10px 40px}
  .side{border-left:0;border-top:1px solid var(--line);max-height:40%;flex:none}
  .docname{max-width:18ch}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <span class="brand">Editor de PDF</span>
    <span class="docname" id="docname">sem arquivo</span>
    <span class="spacer"></span>
    <div class="zoom">
      <button class="btn small" id="zout" aria-label="Diminuir zoom">−</button>
      <span id="zval">100%</span>
      <button class="btn small" id="zin" aria-label="Aumentar zoom">+</button>
      <button class="btn small" id="zfit">Ajustar</button>
    </div>
    <button class="btn" id="openbtn">Abrir PDF</button>
    <button class="btn primary" id="savebtn" disabled>Salvar PDF</button>
    <input type="file" id="pdfin" accept="application/pdf,.pdf" hidden>
    <input type="file" id="imgin" accept="image/*" hidden>
    <input type="file" id="imgrep" accept="image/*" hidden>
    <input type="file" id="imgpdf" accept="image/*" hidden>
  </header>
  <div class="work">
    <nav class="rail" aria-label="Ferramentas">
      <button class="tool" data-tool="select" aria-pressed="true" title="Selecionar e editar texto (V)">
        <svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg>Editar</button>
      <button class="tool" data-tool="text" aria-pressed="false" title="Adicionar caixa de texto (T)">
        <svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>Texto</button>
      <button class="tool" data-tool="image" aria-pressed="false" title="Inserir foto (I)">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-9 9"/></svg>Foto</button>
      <button class="tool" data-tool="rect" aria-pressed="false" title="Retângulo para cobrir ou destacar (R)">
        <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>Forma</button>
    </nav>
    <main class="desk" id="desk">
      <div class="pages" id="pages"></div>
    </main>
    <aside class="side" id="side" aria-live="polite"></aside>
  </div>
</div>
<div class="status" id="status" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var desk=$('#desk'), pagesEl=$('#pages'), side=$('#side');
var st={bytes:null,name:'',pages:[],zoom:1,tool:'select',sel:null,uid:0,pending:null};
var FAM={sans:'Arimo,Helvetica,Arial,sans-serif',serif:"Tinos,'Times New Roman',serif",mono:"Cousine,'Courier New',monospace"};
var statusT=null;
try{ pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }catch(e){}

function flash(msg,ms){
  var s=$('#status'); s.textContent=msg; s.hidden=false; clearTimeout(statusT);
  statusT=setTimeout(function(){s.hidden=true},ms||2600);
}
function uid(){return ++st.uid}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function hex(r,g,b){return '#'+[r,g,b].map(function(v){return ('0'+v.toString(16)).slice(-2)}).join('')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ---------- abrir PDF ---------- */
function buildItems(tc,vp,P){
  var raw=[];
  tc.items.forEach(function(it){
    if(!it.str || !it.str.trim()) return;
    var t=pdfjsLib.Util.transform(vp.transform,it.transform);
    if(Math.abs(t[1])>0.01||Math.abs(t[2])>0.01) return;
    var fs=Math.hypot(t[2],t[3]); if(fs<2) return;
    var style=(tc.styles&&tc.styles[it.fontName])||{};
    var ff=(style.fontFamily||'sans-serif').toLowerCase();
    raw.push({x:t[4],y:t[5],w:it.width*vp.scale,fs:fs,str:it.str,fn:it.fontName,
      fam:ff.indexOf('mono')>-1?'mono':(ff.indexOf('serif')>-1&&ff.indexOf('sans')<0?'serif':'sans')});
  });
  var out=[];
  raw.forEach(function(r){
    var p=out[out.length-1];
    if(p && Math.abs(p.y-r.y)<p.fs*0.25 && Math.abs(p.fs-r.fs)<p.fs*0.06 && p.fn===r.fn){
      var gap=r.x-(p.x+p.w);
      if(gap>-p.fs*0.3 && gap<p.fs*0.9){
        var sp=(gap>p.fs*0.18 && !/\s$/.test(p.str) && !/^\s/.test(r.str))?' ':'';
        p.str+=sp+r.str; p.w=(r.x+r.w)-p.x; return;
      }
    }
    out.push(r);
  });
  return out.map(function(r){
    return {id:uid(),x:r.x,y:r.y,w:Math.max(r.w,4),fs:r.fs,str:r.str,orig:r.str,fn:r.fn,fam:r.fam,
      bold:false,italic:false,color:null,bg:null,styled:false,edited:false,el:null};
  });
}

async function findImages(pg,vp){
  var out=[];
  try{
    var ol=await pg.getOperatorList(), O=pdfjsLib.OPS, fn=ol.fnArray, ar=ol.argsArray, U=pdfjsLib.Util;
    var ctm=[1,0,0,1,0,0], stack=[];
    for(var i=0;i<fn.length;i++){
      var f=fn[i];
      if(f===O.save) stack.push(ctm.slice());
      else if(f===O.restore){ if(stack.length) ctm=stack.pop(); }
      else if(f===O.transform) ctm=U.transform(ctm,ar[i]);
      else if(f===O.paintFormXObjectBegin){ stack.push(ctm.slice()); if(ar[i]&&ar[i][0]) ctm=U.transform(ctm,ar[i][0]); }
      else if(f===O.paintFormXObjectEnd){ if(stack.length) ctm=stack.pop(); }
      else if(f===O.paintImageXObject||f===O.paintInlineImageXObject||f===O.paintJpegXObject){
        var m=U.transform(vp.transform,ctm), xs=[], ys=[];
        [[0,0],[1,0],[0,1],[1,1]].forEach(function(c){ xs.push(m[0]*c[0]+m[2]*c[1]+m[4]); ys.push(m[1]*c[0]+m[3]*c[1]+m[5]); });
        var x=Math.min.apply(null,xs), y=Math.min.apply(null,ys), w=Math.max.apply(null,xs)-x, h=Math.max.apply(null,ys)-y;
        if(w>=10&&h>=10) out.push({id:uid(),x:x,y:y,w:w,h:h,el:null});
      }
    }
  }catch(e){}
  return out;
}

async function openBytes(bytes,name){
  flash('Abrindo '+name+'…',8000);
  var doc;
  try{
    doc=await pdfjsLib.getDocument({data:bytes.slice(0),isEvalSupported:false}).promise;
  }catch(e){
    flash('Não consegui abrir este arquivo. Ele é um PDF válido e sem senha?',5000); return;
  }
  st.bytes=bytes.slice(0); st.name=name; st.pages=[]; st.sel=null;
  var plDoc=null; try{ plDoc=await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:true}); }catch(e){}
  for(var i=1;i<=doc.numPages;i++){
    var pg=await doc.getPage(i), vp=pg.getViewport({scale:1}), tc=await pg.getTextContent();
    var P={n:i,pg:pg,w:vp.width,h:vp.height,rot:pg.rotate||0,added:[],canvas:null,layer:null,sheet:null,wrap:null,rendered:false,rs:2};
    P.rs=Math.min(2,3200/Math.max(vp.width,vp.height));
    P.items=buildItems(tc,vp,P);
    P.imgs=await findImages(pg,vp);
    P.rpg=null; P.paints=[]; P.pageBg=null; P.bgDirty=false; P.pbgRef={el:null};
    if(plDoc) loadRegions(plDoc,i-1,vp,P); else { P.regs=[]; P.clen=-1; }
    st.pages.push(P);
  }
  $('#docname').textContent=name;
  $('#savebtn').disabled=false;
  buildDOM(); fit(); renderSide();
  flash(doc.numPages+(doc.numPages>1?' páginas':' página')+' abertas. Clique em um texto para editar ou em uma foto para trocar.',4200);
}

var io=null;
function buildDOM(){
  pagesEl.textContent='';
  if(io) io.disconnect();
  io=new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){ renderPage(e.target.__P); } });
  },{root:desk,rootMargin:'900px 0px'});
  st.pages.forEach(function(P){
    var wrap=document.createElement('div'); wrap.className='pagewrap'; wrap.__P=P;
    var sheet=document.createElement('div'); sheet.className='sheet';
    sheet.style.width=P.w+'px'; sheet.style.height=P.h+'px';
    var cv=document.createElement('canvas'); sheet.appendChild(cv);
    var layer=document.createElement('div'); layer.className='layer'; sheet.appendChild(layer);
    var no=document.createElement('div'); no.className='pgno'; no.textContent='Página '+P.n+' de '+st.pages.length;
    wrap.appendChild(sheet); wrap.appendChild(no); pagesEl.appendChild(wrap);
    P.wrap=wrap; P.sheet=sheet; P.canvas=cv; P.layer=layer;
    P.regs.forEach(function(r){ mkReg(P,r); });
    P.imgs.forEach(function(im){ mkPdfImg(P,im); });
    P.items.forEach(function(it){ mkItem(P,it); });
    P.added.forEach(function(a){ mkAdd(P,a); });
    layer.addEventListener('pointerdown',function(e){ layerDown(P,e); });
    wrap.addEventListener('dragover',function(e){ e.preventDefault(); });
    wrap.addEventListener('drop',function(e){ onDrop(P,e); });
    io.observe(wrap);
  });
}

async function renderPage(P){
  if(P.rendered) return; P.rendered=true;
  var vp=(P.rpg||P.pg).getViewport({scale:P.rs});
  P.canvas.width=Math.floor(vp.width); P.canvas.height=Math.floor(vp.height);
  try{
    await (P.rpg||P.pg).render({canvasContext:P.canvas.getContext('2d',{willReadFrequently:true}),viewport:vp}).promise;
  }catch(e){ P.rendered=false; }
}

/* ---------- zoom ---------- */
function setZoom(z){
  st.zoom=clamp(z,0.3,3);
  st.pages.forEach(function(P){
    P.wrap.style.width=(P.w*st.zoom)+'px'; P.wrap.style.height=(P.h*st.zoom)+'px';
    P.sheet.style.transform='scale('+st.zoom+')';
    P.sheet.style.setProperty('--inv',String(1/st.zoom));
  });
  $('#zval').textContent=Math.round(st.zoom*100)+'%';
}
function fit(){
  if(!st.pages.length) return;
  var mw=Math.max.apply(null,st.pages.map(function(p){return p.w}));
  var cs=getComputedStyle(desk), avail=desk.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  setZoom(clamp(avail/mw,0.3,1.6));
}

/* ---------- amostragem de cor ---------- */
function sampleItem(P,it){
  var res={bg:'#ffffff',fg:'#000000'};
  var c=P.canvas; if(!P.rendered||!c.width) return res;

      im.onload=function(){

          c.getContext('2d').drawImage(im,0,0); src=c.toDataURL('image/png'); mime='image/png';

var pvT=null, pvBusy=false, pvDoc=null;

  P.bgDirty=true; clearTimeout(pvT); pvT=setTimeout(refreshPreview,300);
}
async function refreshPreview(){
  if(pvBusy){ pvT=setTimeout(refreshPreview,300); return; }
  pvBusy=true;
  try{
    var pdf=await PDFLib.PDFDocument.load(st.bytes,{ignoreEncryption:true});
    applyBgEdits(pdf,true);
    var out=await pdf.save();
    var doc=await pdfjsLib.getDocument({data:out,isEvalSupported:false}).promise;
    var old=pvDoc; pvDoc=doc;
    for(var i=0;i<st.pages.length;i++){
      var P=st.pages[i]; P.rpg=await doc.getPage(P.n);
      if(P.bgDirty){ P.bgDirty=false; if(P.rendered){ P.rendered=false; await renderPage(P); } }
    }
    if(old) try{ old.destroy(); }catch(e){}
  }catch(e){ flash('Não consegui atualizar a prévia da cor.',3500); }
  pvBusy=false;
}

/* ---------- escolher a área colorida sob o clique ---------- */
function colorDist(a,b){
  var x=parseInt(a.slice(1),16), y=parseInt(b.slice(1),16);
  return Math.abs(((x>>16)&255)-((y>>16)&255))+Math.abs(((x>>8)&255)-((y>>8)&255))+Math.abs((x&255)-(y&255));

function pixelAt(P,x,y){

  try{ var d=P.canvas.getContext('2d').getImageData(px,py,1,1).data; return hex(d[0],d[1],d[2]); }catch(e){ return null; }
}
function paintAt(P,x,y){
  var hit=null;
  P.paints.forEach(function(p){
    var lx=Math.floor(x*P.rs)-p.ox, ly=Math.floor(y*P.rs)-p.oy;
    if(lx>=0&&ly>=0&&lx<p.bw&&ly<p.bh&&p.mask[ly*p.bw+lx]===1) hit=p;

  return hit;
}
function floodArea(P,x,y,tol){
  var c=P.canvas, W=c.width, H=c.height, img;

    if(px<minx)minx=px; if(px>maxx)maxx=px; if(py<miny)miny=py; if(py>maxy)maxy=py;
    var nb=[px>0?p-1:-1, px<W-1?p+1:-1, py>0?p-W:-1, py<H-1?p+W:-1];

function drawPaint(p){

        '<div class="field"><label for="f-op">Opacidade</label><input id="f-op" type="range" min="0.1" max="1" step="0.05" value="'+a.opacity+'"></div>'+
        '<div class="row"><button class="btn small danger" id="f-del">Excluir</button></div>';
      side.innerHTML=h;
      $('#f-fill').addEventListener('input',function(e){ a.fill=e.target.value; styleAdd(a); });
      $('#f-op').addEventListener('input',function(e){ a.opacity=parseFloat(e.target.value); styleAdd(a); });
    }
    $('#f-del').addEventListener('click',function(){ removeAdd(s.P,a); });
  }
}
document.addEventListener('keydown',function(e){
  var ae=document.activeElement, typing=ae&&(ae.isContentEditable||/INPUT|SELECT|TEXTAREA/.test(ae.tagName));
  if(typing||!st.sel||st.sel.kind!=='add') return;
  var a=st.sel.ref, step=e.shiftKey?10:1;
  if(e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); removeAdd(st.sel.P,a); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); a.x-=step; styleAdd(a); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); a.x+=step; styleAdd(a); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); a.y-=step; styleAdd(a); }
  else if(e.key==='ArrowDown'){ e.preventDefault(); a.y+=step; styleAdd(a); }
  else if(e.key==='Enter'&&a.type==='text'){ e.preventDefault(); editText(st.sel.P,a); }
});

/* ---------- exportar ---------- */
function rgbOf(L,hx){
  var v=parseInt((hx||'#000000').slice(1),16);
  return L.rgb(((v>>16)&255)/255,((v>>8)&255)/255,(v&255)/255);
}
function safe(f,s){
  var o=''; s=s.normalize('NFC');
  for(var ch of s){ try{ f.encodeText(ch); o+=ch; }catch(e){ o+='?'; } }
  return o;
}
async function buildPdf(){
  var L=PDFLib, pdf=await L.PDFDocument.load(st.bytes,{ignoreEncryption:true}), fc={}, ic={};
  st.bgWarn=false; applyBgEdits(pdf,false);
  var pgs=pdf.getPages();
  async function font(fam,b,i){
    var base=fam==='serif'?'Times':(fam==='mono'?'Courier':'Helvetica'), nm;
    if(fam==='serif') nm='Times'+(b&&i?'RomanBoldItalic':b?'RomanBold':i?'RomanItalic':'Roman');
    else if(fam==='mono') nm='Courier'+(b&&i?'BoldOblique':b?'Bold':i?'Oblique':'');
    else nm='Helvetica'+(b&&i?'BoldOblique':b?'Bold':i?'Oblique':'');
    return fc[nm]||(fc[nm]=await pdf.embedFont(L.StandardFonts[nm]));
  }
  for(var k=0;k<st.pages.length;k++){
    var P=st.pages[k], pg=pgs[k], box=pg.getCropBox ? pg.getCropBox() : pg.getMediaBox();
    var X=function(x){return box.x+x}, Y=function(y){return box.y+box.height-y};
    for(var pi=0;pi<P.paints.length;pi++){
      var pn=P.paints[pi]; if(pn.cur===pn.orig) continue;
      var pb64=pn.cv.toDataURL('image/png').split(',')[1], pbin=atob(pb64), pu8=new Uint8Array(pbin.length);
      for(var pq=0;pq<pbin.length;pq++) pu8[pq]=pbin.charCodeAt(pq);
      var pim=await pdf.embedPng(pu8);
      pg.drawImage(pim,{x:X(pn.x),y:Y(pn.y+pn.h),width:pn.w,height:pn.h});
    }
    for(var m=0;m<P.items.length;m++){
      var it=P.items[m]; if(!(it.edited||it.mod)) continue;
      pg.drawRectangle({x:X(it.x-1),y:Y(it.y+it.fs*0.3),width:Math.max(it.w,it.el?it.el.offsetWidth:0)+2,height:it.fs*1.25,color:rgbOf(L,effBg(it)||'#ffffff')});
      if(it.str){
        var f=await font(it.fam,it.bold,it.italic);
        pg.drawText(safe(f,it.str),{x:X(it.x),y:Y(it.y),size:it.fs,font:f,color:rgbOf(L,it.color||'#000000')});
      }
    }
    for(var n=0;n<P.added.length;n++){
      var a=P.added[n];
      if(a.type==='rect'){
        pg.drawRectangle({x:X(a.x),y:Y(a.y+a.h),width:a.w,height:a.h,color:rgbOf(L,a.fill),opacity:a.opacity});
      }else if(a.type==='image'){
        var img=ic[a.src]; if(!img){
          var b64=a.src.split(',')[1], bin=atob(b64), u8=new Uint8Array(bin.length);
          for(var q=0;q<bin.length;q++) u8[q]=bin.charCodeAt(q);
          img=ic[a.src]=a.mime==='image/jpeg'?await pdf.embedJpg(u8):await pdf.embedPng(u8);
        }
        var bx=X(a.x), by=Y(a.y+a.h), sc=Math.max(a.w/(a.nw||a.w),a.h/(a.nh||a.h)), dw=(a.nw||a.w)*sc, dh=(a.nh||a.h)*sc;
        pg.pushOperators(L.pushGraphicsState());
        if(a.shape==='ellipse'){
          var rx=a.w/2, ry=a.h/2, kx=rx*0.5522847498, ky=ry*0.5522847498, cx=bx+rx, cy=by+ry;
          pg.pushOperators(L.moveTo(cx+rx,cy),
            L.appendBezierCurve(cx+rx,cy+ky,cx+kx,cy+ry,cx,cy+ry),
            L.appendBezierCurve(cx-kx,cy+ry,cx-rx,cy+ky,cx-rx,cy),
            L.appendBezierCurve(cx-rx,cy-ky,cx-kx,cy-ry,cx,cy-ry),
            L.appendBezierCurve(cx+kx,cy-ry,cx+rx,cy-ky,cx+rx,cy),
            L.closePath(),L.clip(),L.endPath());
        }else{
          pg.pushOperators(L.moveTo(bx,by),L.lineTo(bx+a.w,by),L.lineTo(bx+a.w,by+a.h),L.lineTo(bx,by+a.h),L.closePath(),L.clip(),L.endPath());
        }
        pg.drawImage(img,{x:bx+(a.w-dw)/2,y:by+(a.h-dh)/2,width:dw,height:dh,opacity:a.opacity});
        pg.pushOperators(L.popGraphicsState());
      }else if(a.type==='text'&&a.text){
        var ft=await font(a.fam,a.bold,a.italic), lines=a.text.split('\n'), lh=a.fs*1.2;
        for(var l=0;l<lines.length;l++){
          pg.drawText(safe(ft,lines[l]),{x:X(a.x+1),y:Y(a.y+a.fs*1.0+l*lh),size:a.fs,font:ft,color:rgbOf(L,a.color)});
        }
      }
    }
  }
  return pdf.save();
}
var saving=false;
async function savePdf(){
  if(!st.pages.length) return flash('Abra um PDF primeiro.');
  if(saving) return; saving=true; $('#savebtn').disabled=true;
  try{
    flash('Gerando PDF…',8000);
    var out=await buildPdf();
    if(st.bgWarn) flash('Alguma cor de fundo não pôde ser aplicada neste PDF.',4500);
    var dl=null; try{ dl=await claude.use('downloads'); }catch(e){}
    if(!dl){
      var url=URL.createObjectURL(new Blob([out],{type:'application/pdf'})), an=document.createElement('a');
      an.href=url; an.download=st.name.replace(/\.pdf$/i,'')+'-editado.pdf'; document.body.appendChild(an); an.click(); an.remove();
      setTimeout(function(){URL.revokeObjectURL(url)},4000); flash('PDF salvo.'); return;
    }
    var name=st.name.replace(/\.pdf$/i,'')+'-editado.pdf';
    try{ await dl.save({filename:name,data:out}); flash('PDF salvo.'); }
    catch(err){ if(err&&err.code==='declined') flash('Salvamento cancelado.'); else flash('Não foi possível salvar: '+((err&&err.message)||'erro')+'.',5000); }
  }catch(e){
    flash('Erro ao gerar o PDF: '+(e&&e.message?e.message:e),6000);
  }finally{ saving=false; $('#savebtn').disabled=false; }
}

/* ---------- entrada de arquivos e inicialização ---------- */
function readPdf(file){
  var fr=new FileReader();
  fr.onload=function(){ openBytes(new Uint8Array(fr.result),file.name); };
  fr.readAsArrayBuffer(file);
}
$('#openbtn').addEventListener('click',function(){ $('#pdfin').click(); });
$('#pdfin').addEventListener('change',function(e){ var f=e.target.files[0]; e.target.value=''; if(f) readPdf(f); });
$('#savebtn').addEventListener('click',savePdf);
$('#zin').addEventListener('click',function(){ setZoom(st.zoom*1.15); });
$('#zout').addEventListener('click',function(){ setZoom(st.zoom/1.15); });
$('#zfit').addEventListener('click',fit);
desk.addEventListener('dragover',function(e){ e.preventDefault(); desk.classList.add('drop'); });
desk.addEventListener('dragleave',function(){ desk.classList.remove('drop'); });
desk.addEventListener('drop',function(e){
  e.preventDefault(); desk.classList.remove('drop');
  var f=e.dataTransfer.files&&e.dataTransfer.files[0]; if(!f) return;
  if(/pdf/i.test(f.type)||/\.pdf$/i.test(f.name)) readPdf(f);
  else if(/^image\//.test(f.type)&&st.pages.length) placeImage(visiblePage(),f);
});
var rz=null;
window.addEventListener('resize',function(){ clearTimeout(rz); rz=setTimeout(function(){ if(st.pages.length&&st.zoom<=1.6&&desk.scrollLeft===0) fit(); },200); });

renderSide();

  pagesEl.innerHTML='<div class="empty"><h2>Anexe um PDF para começar</h2><p>Arraste o arquivo para esta área ou use o botão abaixo.</p><button class="btn primary" id="emptybtn">Anexar PDF</button></div>';
  $('#emptybtn').addEventListener('click',function(){ $('#pdfin').click(); });
}
showEmpty();
})();
